
<!DOCTYPE html>
<html lang="ko">

    body { font-family: sans-serif; text-align: center; margin-top: 50px; }

<body>

  <div>
    <button onclick="checkAnswer('주동')">주동</button>

 {"sentence": "선생님이 학생에게 문제를 풀게 했다.", "type": "사동"}, {"sentence": "우리가 고양이를 안게 했다.", "type": "사동"}, {"sentence": "그는 친구를 화나게 했다.", "type": "사동"}, {"sentence": "나는 아이에게 자전거를 타게 했다.", "type": "사동"}, {"sentence": "아버지가 나를 운동하게 했다.", "type": "사동"}, {"sentence": "그녀는 나에게 노래를 시켰다.", "type": "사동"}, {"sentence": "나는 동생을 공부시키고 있다.", "type": "사동"}, {"sentence": "선생님이 학생을 떠들지 못하게 했다.", "type": "사동"}, {"sentence": "나는 친구를 도와주게 했다.", "type": "사동"}, {"sentence": "그는 아이를 울게 했다.", "type": "사동"}];
    let currentQuestion = {};

    function nextQuestion() {
      document.getElementById("result").textContent = "";
      currentQuestion = questions[Math.floor(Math.random() * questions.length)];
      document.getElementById("sentence").textContent = currentQuestion.sentence;
    }

    function checkAnswer(choice) {
      if (choice === currentQuestion.type) {
        document.getElementById("result").textContent = "정답입니다!";
      } else {
        document.getElementById("result").textContent = `오답입니다! 정답: ${currentQuestion.type}`;
      }
    }

    window.onload = nextQuestion;
  </script>
</body>
</html>
